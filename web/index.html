<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <title>윤서 영어 · 시험 범위 30개</title>
  <style>
    :root{--paper:#f6f1e7;--ink:#202621;--muted:#687068;--forest:#174d3a;--orange:#bd5125;--line:#d6cdbc;--white:#fffdf8;--soft:#dfece6}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.shell{width:min(920px,100%);margin:auto;padding:15px 14px 70px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.head h1{margin:0;font-size:1.35rem}.head p{margin:2px 0 0;color:var(--muted);font-size:.86rem}.count{flex:none;padding:6px 10px;border-radius:99px;color:white;background:var(--forest);font-weight:800}
    .filters{position:sticky;top:0;z-index:5;display:flex;gap:7px;overflow-x:auto;margin:0 -14px 12px;padding:9px 14px;background:#f6f1e7f2;border-bottom:1px solid var(--line);scrollbar-width:none}.filter{flex:none;min-height:42px;padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:var(--white);font-weight:750}.filter.active{color:white;background:var(--forest);border-color:var(--forest)}
    .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:15px;color:inherit;background:var(--white);text-decoration:none}.number{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;color:white;background:var(--forest);font-weight:900}.title{min-width:0}.title strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.title small{color:var(--muted)}.arrow{color:var(--orange);font-size:1.3rem}.empty{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:620px){.list{grid-template-columns:1fr}.shell{padding-top:10px}.head{align-items:center}.item{padding:11px}}
  </style>
</head>
<body><main class="shell"><header class="head"><div><h1>윤서 영어 · 시험 범위</h1><p>지문을 골라 바로 학습하세요.</p></div><span class="count">30개</span></header><nav class="filters"><button class="filter active" data-filter="all">전체 30</button><button class="filter" data-filter="26-6">2026년 6월</button><button class="filter" data-filter="25-9">2025년 9월</button></nav><div class="list" id="list"></div></main>
<script>
let data=[],filter='all';const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(){const shown=filter==='all'?data:data.filter(x=>x.exam===filter);document.getElementById('list').innerHTML=shown.map(x=>`<a class="item" href="study.html?id=${x.id}"><span class="number">${x.id}</span><span class="title"><strong>${esc(x.title)}</strong><small>${x.examLabel} · ${x.examNumber}번 · ${x.sentences.length}문장</small></span><span class="arrow">›</span></a>`).join('')||'<p class="empty">표시할 지문이 없습니다.</p>'}document.querySelector('.filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});fetch('data/passages.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>document.getElementById('list').innerHTML='<p class="empty">목록을 불러오지 못했습니다.</p>');
</script></body></html>
