<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <title>윤서 영어 학습</title>
  <style>
    :root{--paper:#f6f1e7;--ink:#202621;--muted:#687068;--forest:#174d3a;--soft:#dfece6;--orange:#bd5125;--orange-soft:#fff0e7;--line:#d6cdbc;--white:#fffdf8;--shadow:0 8px 25px rgba(49,55,46,.08)}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.7} button,select,input{font:inherit} button{touch-action:manipulation}.shell{width:min(920px,100%);margin:auto;padding:12px 14px 70px}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.home,.move{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--white);font-weight:750;text-decoration:none}.passage-select{max-width:190px;min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--white);padding:7px 9px;font-weight:700}
    .profile{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--white)}.profile p{margin:0}.profiles{display:flex;gap:6px}.profile-button{min-height:42px;padding:7px 10px;border:1px solid var(--line);border-radius:11px;background:white;font-weight:760}.profile-button.active{color:white;background:var(--forest);border-color:var(--forest)}
    .tabs{position:sticky;top:0;z-index:10;display:flex;gap:7px;overflow-x:auto;margin:10px -14px 18px;padding:9px 14px;background:rgba(246,241,231,.95);border-bottom:1px solid var(--line);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:none;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--white);font-weight:760}.tab[aria-selected=true]{color:white;background:var(--forest);border-color:var(--forest)}
    .panel[hidden]{display:none}.meta{margin:0 0 12px;color:var(--muted);font-size:.9rem}.card,.sentence,.vocab,.quiz,.source{background:var(--white);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.original{padding:20px;font:1.12rem/1.92 Georgia,serif}.original p{margin:0 0 1em}.lookup{display:inline;padding:0 1px;border:0;border-bottom:2px dotted currentColor;color:var(--forest);background:transparent;font:inherit}.lookup.phrase{color:var(--orange)}
    .tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.tool{min-height:42px;padding:7px 11px;border:1px solid var(--line);border-radius:11px;background:var(--white);font-weight:720}.tool.primary{color:white;background:var(--forest)}.tool.danger{color:#8d351c;background:var(--orange-soft);border-color:#e8b397}
    .sentence-list{display:grid;gap:12px}.sentence{overflow:hidden}.sentence-head{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 16px;color:white;background:var(--forest)}.sentence-head p{margin:2px 0 0;font:700 1.02rem/1.6 Georgia,serif}.sentence-no{font-size:.74rem;color:#c3ddd2}.hide{align-self:start;padding:6px 9px;border:1px solid #ffffff66;border-radius:9px;color:white;background:#ffffff18;font-size:.78rem}.chunks{padding:5px 16px}.chunk{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}.chunk:last-child{border-bottom:0}.chunk-en{font:700 1rem/1.55 Georgia,serif}.chunk-ko{color:var(--forest)}.translation{width:100%;margin:0;padding:12px 16px;border:0;background:var(--soft);color:var(--ink);text-align:left}.translation.hard,.chunk-reveal{min-height:46px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);background:#faf7ef;font-weight:750;text-align:center;cursor:pointer}.natural{font-weight:700}.mode.active{color:white;background:var(--forest);border-color:var(--forest)}
    .vocab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.group{margin:20px 0 9px}.vocab{padding:13px}.vocab.known:not(.reveal){display:none}.vocab.unknown{border-color:#e39b76;background:var(--orange-soft)}.word{margin:0;font-weight:850}.meaning{margin:3px 0 9px;color:var(--muted)}.choices{display:flex;gap:6px}.choice{min-height:38px;flex:1;border:1px solid var(--line);border-radius:9px;background:white;font-weight:700}.unknown-button{color:#9b3e1e}
    .quiz-list{display:grid;gap:10px}.quiz{overflow:hidden}.quiz summary{display:flex;justify-content:space-between;gap:8px;padding:14px 16px;font-weight:800;cursor:pointer}.quiz-body{padding:0 16px 16px}.quiz-choices{display:grid;gap:7px}.quiz-choice-row{display:grid;grid-template-columns:1fr auto;gap:6px}.quiz-choice{display:flex;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:white}.quiz-choice:has(input:checked){border-color:var(--forest);background:var(--soft)}.choice-translate{min-width:54px;border:1px solid var(--line);border-radius:10px;color:var(--forest);background:var(--white);font-size:.82rem;font-weight:800}.feedback{padding:10px;border-radius:10px;font-weight:750}.feedback.correct{color:#174d3a;background:var(--soft)}.feedback.wrong{color:#913b1d;background:var(--orange-soft)}.answer{display:none;margin-top:8px;padding:11px;border-left:4px solid var(--orange);background:#fff7ef}.answer.visible{display:block}.source{margin-top:16px;padding:15px}.source a{color:var(--forest);font-weight:800}
    .question-passage{margin:0 0 14px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#faf7ef;white-space:pre-line;font:1rem/1.75 Georgia,serif}
    .original-translation-toggle{width:100%;min-height:46px;margin-top:10px;border:1px solid var(--line);border-radius:12px;color:var(--forest);background:var(--white);font-weight:800}.original-translation{margin-top:8px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.original-translation p{margin:0 0 .8em}.original-translation p:last-child{margin-bottom:0}
    .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:min(90vw,600px);padding:13px;border-radius:13px;color:white;background:#174d3af5;text-align:center;transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:.18s}.toast.visible{opacity:1;transform:translate(-50%,0)}.empty{padding:20px;text-align:center;color:var(--muted)}
    .sentence-head .lookup{color:#fff;background:transparent;border-bottom-color:#bfe7d7}.sentence-head .lookup.phrase{color:#ffd39f;border-bottom-color:#ffd39f}
    @media(max-width:620px){.profile{grid-template-columns:1fr}.profiles{display:grid;grid-template-columns:1fr 1fr}.vocab-grid{grid-template-columns:1fr}.sentence-head{grid-template-columns:1fr}.chunk{grid-template-columns:1fr;gap:5px}.hide{justify-self:start}.original{padding:17px}.topline{align-items:stretch}.passage-select{min-width:0;flex:1}}
  </style>
</head>
<body><main class="shell">
  <div class="topline"><a class="home" href="./">☰ 30개 지문</a><a class="move" id="prevLink" href="#">‹ 이전</a><select id="passageSelect" class="passage-select" aria-label="지문 선택"></select><a class="move" id="nextLink" href="#">다음 ›</a></div>
  <div class="profile"><p><strong id="profileName">테스트용 기록</strong><br><small id="syncStatus">서버에서 불러오는 중...</small></p><div class="profiles"><button class="profile-button active" data-profile="test">테스트용</button><button class="profile-button" data-profile="yunseo">윤서 실전용</button></div></div>
  <nav class="tabs" role="tablist"><button class="tab" data-panel="originalPanel" aria-selected="true">원문만</button><button class="tab" data-panel="readingPanel" aria-selected="false">직독직해</button><button class="tab" data-panel="vocabPanel" aria-selected="false">숙어·단어</button><button class="tab" data-panel="quizPanel" aria-selected="false">기출·연관 문제</button></nav>
  <section class="panel" id="originalPanel"><p class="meta" id="originalMeta"></p><article class="card original" id="originalText"></article><button class="original-translation-toggle" id="toggleOriginalTranslation" aria-expanded="false">전체 해석 보기</button><div class="original-translation" id="originalTranslation" hidden></div></section>
  <section class="panel" id="readingPanel" hidden><div class="tools"><button class="tool mode" data-mode="easy">EASY</button><button class="tool mode" data-mode="hard">HARD</button><button class="tool" id="showHiddenSentences">숨긴 문장 보기</button><button class="tool danger" id="resetSentences">문장 숨김 초기화</button></div><p class="meta" id="sentenceSummary"></p><div class="sentence-list" id="sentenceList"></div><div class="empty" id="sentenceEmpty" hidden>모든 문장을 숨겼어요.</div></section>
  <section class="panel" id="vocabPanel" hidden><div class="tools"><button class="tool primary" id="showKnown">숨긴 항목 보기</button><button class="tool danger" id="resetState">이 지문 전체 초기화</button></div><p class="meta">현재 프로필에 서버 자동 저장됩니다.</p><h3 class="group">숙어와 표현</h3><div class="vocab-grid" id="phraseGrid"></div><h3 class="group">필수 단어</h3><div class="vocab-grid" id="wordGrid"></div></section>
  <section class="panel" id="quizPanel" hidden><div class="tools"><button class="tool quiz-filter primary" data-filter="all">전체</button><button class="tool quiz-filter" data-filter="wrong">오답만</button><button class="tool quiz-filter" data-filter="hidden">숨긴 문제</button><button class="tool" id="toggleAnswers">정답 및 해설 보기</button><button class="tool" id="resetQuiz">푼 문제 초기화</button></div><p class="meta" id="quizSummary"></p><div class="quiz-list" id="quizList"></div><article class="source" id="relatedSource"></article></section>
</main><div class="toast" id="meaningToast" role="status"></div>
<script>
  const params=new URLSearchParams(location.search), passageId=/^(0[1-9]|[12][0-9]|30)$/.test(params.get('id')||'')?params.get('id'):'01';
  const previous=Math.max(1,Number(passageId)-1).toString().padStart(2,'0'),prevLink=document.getElementById('prevLink');prevLink.href=`study.html?id=${previous}`;prevLink.style.visibility=passageId==='01'?'hidden':'';
  const emptyState=()=>({version:1,known:{},unknown:{},quiz:{},hiddenSentences:{},readingMode:'easy'}); let data=[],passage,state=emptyState(),profile=sessionStorage.getItem('yunseo-profile')==='yunseo'?'yunseo':'test',revealKnown=false,revealSentences=false,answers=false,quizFilter='all',saveQueue=Promise.resolve(),revealedTranslations=new Set(),openQuizzes=new Set();
  const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const api=p=>new URL(`api/state/${passageId}/${p}`,document.baseURI);
  function status(text,bad=false){const el=document.getElementById('syncStatus');el.textContent=text;el.style.color=bad?'#9a3d21':''}
  async function loadState(){status('서버에서 불러오는 중...');try{const r=await fetch(api(profile),{cache:'no-store'});if(!r.ok)throw Error();state={...emptyState(),...await r.json()};status('서버 저장 연결됨')}catch{state=emptyState();status('서버 연결 실패',true)}renderAll()}
  function save(){const p=profile,body=JSON.stringify(state);status('저장 중...');saveQueue=saveQueue.catch(()=>{}).then(async()=>{const r=await fetch(api(p),{method:'POST',headers:{'Content-Type':'application/json'},body});if(!r.ok)throw Error();if(p===profile)status('서버에 저장됨')}).catch(()=>{if(p===profile)status('저장 실패',true)});return saveQueue}
  function markText(text){const items=[...passage.phrases.map(x=>[...x,'phrase']),...(passage.lookupWords||passage.words).map(x=>[...x,'word'])].sort((a,b)=>b[0].length-a[0].length);if(!items.length)return escapeHtml(text);const pattern=items.map(x=>x[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),re=new RegExp(`\\b(?:${pattern})\\b`,'gi');let result='',last=0;for(const match of text.matchAll(re)){const item=items.find(x=>x[0].toLowerCase()===match[0].toLowerCase());result+=escapeHtml(text.slice(last,match.index))+`<button class="lookup ${item[2]}" data-meaning="${escapeHtml(item[1])}">${escapeHtml(match[0])}</button>`;last=match.index+match[0].length}return result+escapeHtml(text.slice(last))}
  function renderStatic(){document.title=`${passage.id}번 · 윤서 영어`;document.getElementById('originalMeta').textContent=`${passage.id}번 · ${passage.examLabel} 고2 ${passage.examNumber}번 · 색이 다른 표현을 누르면 뜻이 5초간 보여요.`;document.getElementById('originalText').innerHTML=passage.sentences.map(x=>`<p>${markText(x.en)}</p>`).join('');document.getElementById('passageSelect').innerHTML=data.map(x=>`<option value="${x.id}" ${x.id===passageId?'selected':''}>${x.id}. ${escapeHtml(x.title)}</option>`).join('');const next=Math.min(30,Number(passageId)+1).toString().padStart(2,'0');document.getElementById('nextLink').href=next==='01'?'01_fallacy-of-composition.html':`study.html?id=${next}`;document.getElementById('nextLink').style.visibility=passageId==='30'?'hidden':'';document.getElementById('relatedSource').innerHTML=`<strong>확인된 연관 문제 자료</strong><p>${escapeHtml(passage.relatedSource.note)}</p><a href="${passage.relatedSource.url}" target="_blank" rel="noopener">${escapeHtml(passage.relatedSource.label)} 보기 ↗</a><p class="meta">아래 문제는 선생님 학습지에 실린 원래 기출입니다. 외부 변형문제는 저작권과 원문 정확성을 위해 출처에서 확인합니다.</p>`}
  function renderOriginalTranslation(){document.getElementById('originalTranslation').innerHTML=passage.sentences.map(x=>`<p>${escapeHtml(x.ko)}</p>`).join('')}
  function renderSentences(){const hard=state.readingMode==='hard',visible=passage.sentences.map((x,i)=>({x,i})).filter(({i})=>revealSentences||!state.hiddenSentences[i]);document.getElementById('sentenceList').innerHTML=visible.map(({x,i})=>`<article class="sentence"><div class="sentence-head"><div><span class="sentence-no">SENTENCE ${i+1}</span><p>${markText(x.en)}</p></div><button class="hide" data-sentence="${i}">${state.hiddenSentences[i]?'문장 다시 보이기':'쉬운 문장 숨기기'}</button></div><div class="chunks">${x.chunks.map((chunk,j)=>{const key=`${i}:${j}`;return `<div class="chunk"><div class="chunk-en">${markText(chunk[0])}</div>${hard&&!revealedTranslations.has(key)?`<button class="chunk-reveal" data-translation="${key}">해석 보기</button>`:`<div class="chunk-ko">→ ${escapeHtml(chunk[1])}</div>`}</div>`}).join('')}</div>${hard&&!revealedTranslations.has(`${i}:natural`)?`<button class="translation hard" data-translation="${i}:natural">자연스러운 전체 해석 보기</button>`:`<p class="translation natural">자연스러운 해석 · ${escapeHtml(x.ko)}</p>`}</article>`).join('');const count=Object.values(state.hiddenSentences).filter(Boolean).length;document.getElementById('showHiddenSentences').textContent=revealSentences?'숨긴 문장 다시 감추기':`숨긴 문장 보기 (${count})`;document.getElementById('sentenceSummary').textContent=`${hard?'HARD · 덩어리 해석을 눌러 확인':'EASY · 직독직해 바로 보기'} · 숨긴 문장 ${count}개`;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.readingMode));document.getElementById('sentenceEmpty').hidden=revealSentences||visible.length>0}
  function vocabCard(type,item){const id=`${type}:${item[0]}`,known=!!state.known[id],unknown=!!state.unknown[id];return `<article class="vocab ${known?'known':''} ${unknown?'unknown':''} ${revealKnown?'reveal':''}"><p class="word">${escapeHtml(item[0])}</p><p class="meaning">${escapeHtml(item[1])}</p><div class="choices"><button class="choice" data-action="known" data-id="${escapeHtml(id)}">알아요</button><button class="choice unknown-button" data-action="unknown" data-id="${escapeHtml(id)}">몰라요</button></div></article>`}
  function renderVocab(){document.getElementById('phraseGrid').innerHTML=passage.phrases.length?passage.phrases.map(x=>vocabCard('phrase',x)).join(''):'<p class="meta">별도 숙어 없음</p>';document.getElementById('wordGrid').innerHTML=passage.words.map(x=>vocabCard('word',x)).join('');const known=Object.values(state.known).filter(Boolean).length;document.getElementById('showKnown').textContent=revealKnown?'아는 항목 다시 숨기기':`숨긴 항목 보기 (${known})`}
  const qstate=i=>state.quiz[i]||{selected:null,checked:false,wrong:false,hidden:false};
  function feedbackText(q,s){return s.wrong?`선택한 답은 틀렸어요. 정답은 ${'①②③④⑤'[q.answer]}입니다. 해설에서 근거를 확인하세요.`:'정답입니다!'}
  function renderQuizzes(){const visible=passage.questions.map((q,i)=>({q,i,s:qstate(i)})).filter(x=>quizFilter==='wrong'?x.s.wrong&&!x.s.hidden:quizFilter==='hidden'?x.s.hidden:!x.s.hidden);document.getElementById('quizList').innerHTML=visible.length?visible.map(({q,i,s})=>`<details class="quiz" data-quiz-details="${i}" ${openQuizzes.has(i)?'open':''}><summary><span>${escapeHtml(q.title)}</span><span>${s.hidden?'숨김':s.wrong?'오답':s.checked?'정답':'미풀이'}</span></summary><div class="quiz-body">${q.passage?`<div class="question-passage">${markText(q.passage)}</div>`:''}<p><strong>${escapeHtml(q.question)}</strong></p><div class="quiz-choices">${q.choices.map((c,j)=>`<div class="quiz-choice-row"><label class="quiz-choice"><input type="radio" name="quiz-${i}" value="${j}" ${Number(s.selected)===j?'checked':''}><span>${'①②③④⑤'[j]} ${markText(c)}</span></label>${q.choiceMeanings?.[j]?`<button class="choice-translate" data-choice-meaning="${escapeHtml(q.choiceMeanings[j])}">해석</button>`:''}</div>`).join('')}</div><div class="tools"><button class="tool primary check" data-quiz="${i}">채점하기</button><button class="tool" data-hide="${i}">${s.hidden?'문제 다시 보이기':'쉬운 문제 숨기기'}</button></div><p class="feedback ${s.wrong?'wrong':'correct'}" ${s.checked?'':'hidden'}>${escapeHtml(feedbackText(q,s))}</p><div class="answer ${answers?'visible':''}"><strong>정답 ${'①②③④⑤'[q.answer]}</strong><br>${escapeHtml(q.explanation)}</div></div></details>`).join(''):'<div class="empty">표시할 문제가 없어요.</div>';const wrong=passage.questions.filter((_,i)=>qstate(i).wrong&&!qstate(i).hidden).length,hidden=passage.questions.filter((_,i)=>qstate(i).hidden).length;document.getElementById('quizSummary').textContent=`기출·재구성 ${passage.questions.length}문제 · 오답 ${wrong}개 · 숨김 ${hidden}개`;document.querySelectorAll('.quiz-filter').forEach(b=>b.classList.toggle('primary',b.dataset.filter===quizFilter));document.getElementById('toggleAnswers').textContent=answers?'정답 및 해설 숨기기':'정답 및 해설 보기'}
  function renderProfile(){document.getElementById('profileName').textContent=profile==='test'?'테스트용 기록':'윤서 실전용 기록';document.querySelectorAll('.profile-button').forEach(b=>b.classList.toggle('active',b.dataset.profile===profile))} function renderAll(){renderProfile();renderSentences();renderVocab();renderQuizzes()}
  function selectPanel(id){const panel=/^(originalPanel|readingPanel|vocabPanel|quizPanel)$/.test(id)?id:'originalPanel';document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.panel===panel)));document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!==panel)}selectPanel(sessionStorage.getItem('yunseo-panel'));
  document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;sessionStorage.setItem('yunseo-panel',b.dataset.panel);selectPanel(b.dataset.panel)});
  document.getElementById('passageSelect').addEventListener('change',e=>location.href=`study.html?id=${e.target.value}`);
  document.getElementById('toggleOriginalTranslation').addEventListener('click',e=>{const box=document.getElementById('originalTranslation'),show=box.hidden;box.hidden=!show;e.currentTarget.textContent=show?'전체 해석 숨기기':'전체 해석 보기';e.currentTarget.setAttribute('aria-expanded',String(show))});
  document.querySelectorAll('.profile-button').forEach(b=>b.addEventListener('click',async()=>{if(b.dataset.profile===profile)return;await saveQueue.catch(()=>{});profile=b.dataset.profile;sessionStorage.setItem('yunseo-profile',profile);revealKnown=revealSentences=answers=false;await loadState()}));
  document.getElementById('readingPanel').addEventListener('click',e=>{const sentence=e.target.closest('[data-sentence]'),translation=e.target.closest('[data-translation]'),mode=e.target.closest('[data-mode]');if(sentence){const i=Number(sentence.dataset.sentence);if(state.hiddenSentences[i])delete state.hiddenSentences[i];else state.hiddenSentences[i]=true;save();renderSentences()}else if(translation){const key=translation.dataset.translation;revealedTranslations.add(key);renderSentences();setTimeout(()=>{revealedTranslations.delete(key);if(state.readingMode==='hard')renderSentences()},4000)}else if(mode){state.readingMode=mode.dataset.mode;revealedTranslations.clear();save();renderSentences()}});document.getElementById('showHiddenSentences').onclick=()=>{revealSentences=!revealSentences;renderSentences()};document.getElementById('resetSentences').onclick=()=>{if(!confirm(`${passage.id}번에서 숨긴 문장을 모두 다시 보이게 할까요?`))return;state.hiddenSentences={};revealSentences=false;save();renderSentences()};
  document.getElementById('vocabPanel').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;if(b.dataset.action==='known'){state.known[id]=true;delete state.unknown[id]}else{state.unknown[id]=true;delete state.known[id]}save();renderVocab()});document.getElementById('showKnown').onclick=()=>{revealKnown=!revealKnown;renderVocab()};
  document.getElementById('resetState').onclick=()=>{if(!confirm(`${passage.id}번 지문의 현재 프로필 기록만 초기화할까요?`))return;state=emptyState();revealKnown=revealSentences=answers=false;revealedTranslations.clear();save();renderAll()};
  document.getElementById('quizPanel').addEventListener('change',e=>{const i=e.target.closest('input[type=radio]');if(!i)return;const n=Number(i.name.replace('quiz-',''));state.quiz[n]={...qstate(n),selected:Number(i.value),checked:false};save()});document.getElementById('quizPanel').addEventListener('click',e=>{const translate=e.target.closest('[data-choice-meaning]'),check=e.target.closest('[data-quiz]'),hide=e.target.closest('[data-hide]');if(translate){showToast(translate.dataset.choiceMeaning,4000)}else if(check){const i=Number(check.dataset.quiz),selected=document.querySelector(`input[name=quiz-${i}]:checked`);if(!selected){alert('답을 먼저 선택하세요.');return}const correct=Number(selected.value)===passage.questions[i].answer;state.quiz[i]={...qstate(i),selected:Number(selected.value),checked:true,wrong:!correct};openQuizzes.add(i);save();renderQuizzes()}else if(hide){const i=Number(hide.dataset.hide);state.quiz[i]={...qstate(i),hidden:true};save();renderQuizzes()}});
  document.getElementById('quizList').addEventListener('toggle',e=>{const details=e.target.closest('[data-quiz-details]');if(!details)return;const i=Number(details.dataset.quizDetails);if(details.open)openQuizzes.add(i);else openQuizzes.delete(i)},true);
  document.getElementById('toggleAnswers').onclick=()=>{answers=!answers;renderQuizzes()};document.getElementById('resetQuiz').onclick=()=>{state.quiz={};answers=false;save();renderQuizzes()};
  document.querySelectorAll('.quiz-filter').forEach(b=>b.addEventListener('click',()=>{quizFilter=b.dataset.filter;renderQuizzes()}));
  let timer;function showToast(content,duration){const toast=document.getElementById('meaningToast');clearTimeout(timer);toast.innerHTML=content;toast.classList.add('visible');timer=setTimeout(()=>toast.classList.remove('visible'),duration)}document.addEventListener('click',e=>{const b=e.target.closest('.lookup');if(!b)return;e.preventDefault();e.stopPropagation();showToast(`<strong>${escapeHtml(b.textContent)}</strong> · ${escapeHtml(b.dataset.meaning)}`,3000)});
  fetch('data/passages.json',{cache:'no-store'}).then(r=>r.json()).then(items=>{data=items;passage=data.find(x=>x.id===passageId)||data[0];renderStatic();renderOriginalTranslation();loadState()}).catch(()=>{document.body.innerHTML='<p class="empty">학습 자료를 불러오지 못했습니다.</p>'});
</script></body></html>
